[project]
name = "jev-factorio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydirectinput>=1.0.4",
    "python-dotenv>=1.2.4",
    "typesafe-sdk[pil]>=0.7.5",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["jev_factorio"]

[[tool.mypy.overrides]]
module = ["pydirectinput"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
